apiVersion: v1
kind: PersistentVolume
metadata:
  name: vivitel-sqlite-pv
  namespace: vivitel
spec:
  capacity:
    storage: 40Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: vivitel-hostpath
  hostPath:
    path: /opt/vivitel/data
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vivitel-sqlite-data
  namespace: vivitel
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: vivitel-hostpath
  resources:
    requests:
      storage: 40Gi
---
# Shared Valkey for sessions/cache across the four services
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  namespace: vivitel
  labels:
    app: valkey
spec:
  replicas: 1
  selector:
    matchLabels:
      app: valkey
  template:
    metadata:
      labels:
        app: valkey
    spec:
      containers:
        - name: valkey
          image: valkey/valkey:8-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
  namespace: vivitel
spec:
  selector:
    app: valkey
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
