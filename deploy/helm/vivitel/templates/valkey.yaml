{{- if .Values.valkey.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-valkey
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ .Release.Name }}-valkey
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-valkey
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-valkey
    spec:
      containers:
        - name: valkey
          image: {{ .Values.valkey.image }}
          ports:
            - containerPort: 6379
          resources:
            {{- toYaml .Values.valkey.resources | nindent 12 }}
          readinessProbe:
            tcpSocket:
              port: 6379
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 6379
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
  namespace: {{ .Values.global.namespace }}
spec:
  selector:
    app: {{ .Release.Name }}-valkey
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
{{- end }}
