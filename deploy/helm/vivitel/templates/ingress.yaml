{{- if .Values.ingress.enabled }}
{{- $hosts := prepend (.Values.ingress.additionalHosts | default (list)) .Values.ingress.host }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-gateway
  namespace: {{ .Values.global.namespace }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    {{- range $host := $hosts }}
    - host: {{ $host }}
      http:
        paths:
          - path: /ingest
            pathType: Prefix
            backend:
              service:
                name: {{ $.Release.Name }}-track
                port:
                  number: 80
          - path: /stream
            pathType: Prefix
            backend:
              service:
                name: {{ $.Release.Name }}-track
                port:
                  number: 80
          - path: /device
            pathType: Prefix
            backend:
              service:
                name: {{ $.Release.Name }}-track
                port:
                  number: 80
          - path: /d1/assets
            pathType: Prefix
            backend:
              service:
                name: {{ $.Release.Name }}-track
                port:
                  number: 80
          - path: /rbac
            pathType: Prefix
            backend:
              service:
                name: {{ $.Release.Name }}-control
                port:
                  number: 80
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: {{ $.Release.Name }}-control
                port:
                  number: 80
          - path: /kv
            pathType: Prefix
            backend:
              service:
                name: {{ $.Release.Name }}-control
                port:
                  number: 80
          - path: /pat
            pathType: Prefix
            backend:
              service:
                name: {{ $.Release.Name }}-control
                port:
                  number: 80
          - path: /support
            pathType: Prefix
            backend:
              service:
                name: {{ $.Release.Name }}-control
                port:
                  number: 80
          - path: /metrics
            pathType: Prefix
            backend:
              service:
                name: {{ $.Release.Name }}-analyse
                port:
                  number: 80
          - path: /d1/telemetry
            pathType: Prefix
            backend:
              service:
                name: {{ $.Release.Name }}-analyse
                port:
                  number: 80
          - path: /deliver
            pathType: Prefix
            backend:
              service:
                name: {{ $.Release.Name }}-deliver
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $.Release.Name }}-control
                port:
                  number: 80
    {{- end }}
{{- end }}
