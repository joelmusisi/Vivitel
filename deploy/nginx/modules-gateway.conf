# Path-based load balancer for Track / Control / Analyse / Deliver.
# Unhealthy backends (failed /health/ready) are taken out via max_fails.

upstream vivitel_track {
  server track:8787 max_fails=2 fail_timeout=10s;
  keepalive 32;
}

upstream vivitel_control {
  server control:8787 max_fails=2 fail_timeout=10s;
  keepalive 32;
}

upstream vivitel_analyse {
  server analyse:8787 max_fails=2 fail_timeout=10s;
  keepalive 32;
}

upstream vivitel_deliver {
  server deliver:8787 max_fails=2 fail_timeout=10s;
  keepalive 32;
}

server {
  listen 80;
  client_max_body_size 64m;
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;
  proxy_next_upstream error timeout http_502 http_503 http_504;
  proxy_next_upstream_tries 3;

  location /health/live {
    proxy_pass http://vivitel_control;
  }

  location /health/ready {
    proxy_pass http://vivitel_control;
  }

  location /health {
    proxy_pass http://vivitel_control;
  }

  location /ingest {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_pass http://vivitel_track;
  }

  location /stream {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_pass http://vivitel_track;
  }

  location /ws {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_pass http://vivitel_control;
  }

  location /device {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_pass http://vivitel_track;
  }

  location /d1/assets {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_pass http://vivitel_track;
  }

  location /rbac {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Tenant-Id $http_x_tenant_id;
    proxy_set_header X-Api-Key $http_x_api_key;
    proxy_pass http://vivitel_control;
  }

  location /auth {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_pass http://vivitel_control;
  }

  location /kv {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Tenant-Id $http_x_tenant_id;
    proxy_pass http://vivitel_control;
  }

  location /pat {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_pass http://vivitel_control;
  }

  location /support {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_pass http://vivitel_control;
  }

  location /metrics {
    proxy_pass http://vivitel_analyse;
  }

  location /d1/telemetry {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Tenant-Id $http_x_tenant_id;
    proxy_pass http://vivitel_analyse;
  }

  location /deliver {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Tenant-Id $http_x_tenant_id;
    proxy_pass http://vivitel_deliver;
  }

  location / {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Tenant-Id $http_x_tenant_id;
    proxy_set_header X-Api-Key $http_x_api_key;
    proxy_pass http://vivitel_control;
  }
}
