# Nginx gateway for systemd multi-instance (vps@track etc.) on one VPS.
# listen 8787 → path route to local module ports.

upstream vivitel_track {
  server 127.0.0.1:8781 max_fails=2 fail_timeout=10s;
}
upstream vivitel_control {
  server 127.0.0.1:8782 max_fails=2 fail_timeout=10s;
}
upstream vivitel_analyse {
  server 127.0.0.1:8783 max_fails=2 fail_timeout=10s;
}
upstream vivitel_deliver {
  server 127.0.0.1:8784 max_fails=2 fail_timeout=10s;
}

server {
  listen 8787;
  client_max_body_size 64m;
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;
  proxy_next_upstream error timeout http_502 http_503 http_504;
  proxy_next_upstream_tries 3;

  location /ingest { proxy_pass http://vivitel_track; }
  location /stream {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_pass http://vivitel_track;
  }
  location /ws {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_pass http://vivitel_control;
  }
  location /device { proxy_pass http://vivitel_track; }
  location /d1/assets { proxy_pass http://vivitel_track; }

  location /rbac { proxy_pass http://vivitel_control; }
  location /auth { proxy_pass http://vivitel_control; }
  location /kv { proxy_pass http://vivitel_control; }
  location /pat { proxy_pass http://vivitel_control; }
  location /support { proxy_pass http://vivitel_control; }
  location /health { proxy_pass http://vivitel_control; }
  location /health/live { proxy_pass http://vivitel_control; }
  location /health/ready { proxy_pass http://vivitel_control; }

  location /metrics { proxy_pass http://vivitel_analyse; }
  location /d1/telemetry { proxy_pass http://vivitel_analyse; }

  location /deliver { proxy_pass http://vivitel_deliver; }

  location / {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Tenant-Id $http_x_tenant_id;
    proxy_set_header X-Api-Key $http_x_api_key;
    proxy_pass http://vivitel_control;
  }
}
