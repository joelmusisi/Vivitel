<!doctype html>
<html lang="en">
  <head>
    <script>
      (function () {
        var host = window.location.hostname.toLowerCase();
        var canonical = "us.vivitelematics.ca";
        var legacyHosts = {
          "vivitelematics.ca": 1,
          "www.vivitelematics.ca": 1
        };
        var typoHosts = {
          "us.vivitelematic.ca": 1,
          "us.vivitelemantics.ca": 1
        };
        if (legacyHosts[host] || typoHosts[host]) {
          window.location.replace(
            "https://" + canonical + window.location.pathname + window.location.search + window.location.hash
          );
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f9fa" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Vivi Telematics</title>
    <meta name="x-build" content="pages-deploy" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://api.vivitelematics.ca" />
    <link rel="icon" type="image/svg+xml" href="/logo-vivi-telematics.svg?v=1" />
    <link rel="apple-touch-icon" href="/logo-vivi-telematics.png?v=1" />
    <script>
      (function () {
        try {
          var stored = String(localStorage.getItem("vivi.theme") || "").toLowerCase();
          var theme = stored === "dark" ? "dark" : "light";
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <style>
      html, body, #root { height: 100%; margin: 0; }
      body { background: #f6f9fa; font-family: system-ui, -apple-system, sans-serif; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
