# Vivitel production infrastructure stack (DevOps build spot).
#
# Runs the optional analytics mirror (PostgreSQL), hot cache (Valkey),
# and the observability plane (Prometheus + Grafana) alongside your VPS API.
#
# The VPS Express server itself is deployed via systemd on the host
# (see backend/vps.service). Point it at the services below.
#
# Usage:
#   cd backend/observability
#   cp .env.production.example .env.production   # edit secrets
#   docker compose -f docker-compose.production.yml --env-file .env.production up -d
#
# Grafana:    http://localhost:3001
# Prometheus: http://localhost:9090
# Postgres:   localhost:5432  (mirror only — SQLite on VPS remains source of truth)
# Valkey:     localhost:6379

services:
  postgres:
    image: postgres:16-alpine
    container_name: vivi-postgres-mirror
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vivitel}
      POSTGRES_USER: ${POSTGRES_USER:-vivitel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
    volumes:
      - postgres-mirror-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vivitel} -d ${POSTGRES_DB:-vivitel}"]
      interval: 10s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:8-alpine
    container_name: vivi-valkey
    restart: unless-stopped
    command: ["valkey-server", "--requirepass", "${VALKEY_PASSWORD:?set VALKEY_PASSWORD}"]
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "${VALKEY_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: vivi-prometheus
    restart: unless-stopped
    depends_on:
      - postgres
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.2.0
    container_name: vivi-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"

volumes:
  postgres-mirror-data:
  valkey-data:
  prometheus-data:
  grafana-data:
