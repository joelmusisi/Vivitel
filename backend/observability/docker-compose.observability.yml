# Observability stack for the Vivitel VPS Express server.
#
# The VPS server exposes Prometheus metrics at GET /metrics. This compose file
# runs Prometheus (scraper + TSDB) and Grafana (dashboards) so you can monitor
# HTTP latency, telemetry volume, cache health, and device ingest activity.
#
# Usage (from this directory):
#   docker compose -f docker-compose.observability.yml up -d
#   Grafana:    http://localhost:3001  (admin / admin on first login)
#   Prometheus: http://localhost:9090
#
# Point Prometheus at your VPS by editing prometheus/prometheus.yml.

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: vivi-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    ports:
      - "9090:9090"
    extra_hosts:
      # Lets Prometheus reach a VPS server running on the Docker host.
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.2.0
    container_name: vivi-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"

volumes:
  prometheus-data:
  grafana-data:
