[vars]
APP_NAME = "Vivi telematics API"
MAIL_FROM = "no-reply@vivitelematics.ca"
MAIL_FROM_NAME = "Vivi Telematics"
ADMIN_EMAIL = "kizzajamesmusis@gmail.com"
DEFAULT_TENANT_ID = "west-africa"
DEVICE_SERVER_DOMAIN = "162.35.186.103"
# Self-hosted Traccar. Workers cannot fetch bare IPs — use a DNS hostname in this zone
# pointing at the VPS (DNS-only A record). Create: traccar.vivitelematics.ca -> 162.35.186.103
TRACCAR_BASE_URL = "http://traccar.vivitelematics.ca"
DEVICE_SERVER_PORT = "6574"
DEVICE_SERVER_PROTOCOL = "http"
# Operational data (assets, bindings, config, telemetry metadata) → VPS SQLite/Valkey/B2.
# Dedicated DNS-only A record with Caddy TLS; do not reuse the Traccar hostname.
VPS_ORIGIN = "https://vps-api.vivitelematics.ca"
VPS_HOSTNAME = "vps-api.vivitelematics.ca"
VPS_PORT = "443"
VPS_PROTOCOL = "https"
# Used when TRACCAR_TOKEN is sent as Basic auth password (Traccar default pattern).
TRACCAR_USERNAME = "admin"
# Emergency-only switch to allow /auth/admin/bootstrap (still requires x-api-key).
# Keep this disabled unless you are actively recovering admin access.
ALLOW_ADMIN_BOOTSTRAP = "false"
TRACCAR_ALLOW_UNSIGNED_WEBHOOKS = "false"
# United Kingdom GPS IoT keys are worker secrets, not vars:
#   wrangler secret put GPSIOT_WEB_API_KEY
#   wrangler secret put GPSIOT_WEB_SECRET_KEY
# They are used only for requests on uk.vivitelematics.ca.
# Optional: used when the browser Origin header isn't available.
# APP_BASE_URL = "https://us.vivitelematics.ca"
# Demo onboarding mail. Keep the four support inboxes on the worker, never in frontend code.
# wrangler secret put DEMO_SUPPORT_NOTIFY_EMAILS
# Value is a comma-separated list of up to four support inboxes.

[[d1_databases]]
binding = "VIVI_D1"
database_name = "vivi_telematics"
database_id = "67899d57-c409-4df1-a4a3-ea68c70bb34c"

[[durable_objects.bindings]]
name = "REALTIME_HUB"
class_name = "ViviRealtimeHub"

[[durable_objects.bindings]]
name = "TRACCAR_SOCKET_BRIDGE"
class_name = "TraccarSocketBridge"

[[migrations]]
tag = "v1-vivi-realtime-hub"
new_sqlite_classes = ["ViviRealtimeHub"]

[[migrations]]
tag = "v2-traccar-socket-bridge"
new_sqlite_classes = ["TraccarSocketBridge"]

# Poll Traccar for new events and dispatch Vivitel user alerts (email via Resend, in-app KV).
# Serverless cron runs async via ctx.waitUntil — cold starts warmed by scheduleServerlessWarm.
[triggers]
crons = ["*/2 * * * *"]
